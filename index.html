<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>yassx | Modern Desktop</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* RESET & BASE */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: white;
      transition: background 0.8s ease;
    }

    /* SETUP SCREEN */
    .setup-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(20px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      transition: opacity 0.5s;
    }
    .setup-screen.hidden { opacity: 0; pointer-events: none; }
    .setup-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px;
      width: 90%;
      max-width: 500px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      animation: fadeIn 0.6s;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .setup-title {
      font-size: 2.5rem;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #6cf2c2, #7c7cff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-weight: 800;
      text-align: center;
    }
    .setup-subtitle {
      text-align: center;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 30px;
    }
    .setup-input {
      width: 100%;
      padding: 15px 20px;
      margin: 10px 0;
      border-radius: 12px;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      font-size: 16px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: all 0.3s;
    }
    .setup-input:focus {
      outline: none;
      border-color: #6cf2c2;
      background: rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 0 3px rgba(108, 242, 194, 0.2);
    }
    .setup-select {
      width: 100%;
      padding: 15px 20px;
      margin: 10px 0 20px;
      border-radius: 12px;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      font-size: 16px;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .setup-button {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #6cf2c2, #7c7cff);
      color: black;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
      margin-top: 10px;
    }
    .setup-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(108, 242, 194, 0.3);
    }
    .setup-button:active { transform: translateY(0); }

    /* TOP BAR */
    .top-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 50px;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 900;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-gradient {
      background: linear-gradient(135deg, #6cf2c2, #7c7cff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .user-display {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.1);
      padding: 6px 15px;
      border-radius: 20px;
    }
    .user-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6cf2c2, #7c7cff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: black;
    }
    .clock {
      font-size: 15px;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.1);
      padding: 6px 15px;
      border-radius: 20px;
    }

    /* DOCK */
    .dock {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 15px;
      padding: 15px 25px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(15px);
      border-radius: 25px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
      z-index: 800;
    }
    .dock-icon {
      width: 55px;
      height: 55px;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      cursor: pointer;
      transition: all 0.3s;
      position: relative;
    }
    .dock-icon:hover {
      transform: translateY(-10px) scale(1.1);
      background: rgba(255, 255, 255, 0.25);
    }
    .dock-tooltip {
      position: absolute;
      top: -40px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 12px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .dock-icon:hover .dock-tooltip { opacity: 1; }

    /* WINDOWS */
    .window {
      position: absolute;
      width: 700px;
      height: 500px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 25px 75px rgba(0, 0, 0, 0.4);
      overflow: hidden;
      display: none;
      z-index: 10;
    }
    .window.active {
      display: block;
      animation: windowOpen 0.4s;
    }
    @keyframes windowOpen {
      0% { opacity: 0; transform: scale(0.9) translateY(30px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .window.focused {
      box-shadow: 0 30px 100px rgba(0, 0, 0, 0.5);
      border-color: rgba(108, 242, 194, 0.3);
    }
    .window-header {
      height: 45px;
      background: rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      padding: 0 15px;
      cursor: move;
      user-select: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .window-controls {
      display: flex;
      gap: 8px;
      margin-right: 15px;
    }
    .control-dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .control-dot:hover { transform: scale(1.1); }
    .dot-close { background: #ff5f57; }
    .dot-minimize { background: #ffbd2e; }
    .dot-maximize { background: #28c840; }
    .window-title {
      font-size: 14px;
      opacity: 0.9;
      font-weight: 500;
    }
    .window-content {
      height: calc(100% - 45px);
      overflow: auto;
      padding: 20px;
    }

    /* APPS WINDOW */
    .apps-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 20px;
      padding: 10px;
    }
    .app-item {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 15px;
      padding: 20px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.3s;
      border: 1px solid transparent;
    }
    .app-item:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-5px);
      border-color: rgba(108, 242, 194, 0.3);
    }
    .app-icon {
      font-size: 2rem;
      margin-bottom: 5px;
    }
    .app-name {
      font-size: 13px;
      font-weight: 500;
      text-align: center;
    }

    /* BROWSER WINDOW */
    .browser-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    .browser-nav-btn {
      padding: 10px 15px;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      border-radius: 10px;
      color: white;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.3s;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .browser-nav-btn:hover { background: rgba(255, 255, 255, 0.2); }
    .url-bar {
      flex: 1;
      padding: 10px 15px;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 14px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .url-bar:focus { outline: none; border-color: #6cf2c2; }
    .browser-frame {
      width: 100%;
      height: calc(100% - 60px);
      border: none;
      border-radius: 10px;
      background: white;
    }

    /* NOTIFICATIONS */
    .notification {
      position: fixed;
      top: 70px;
      right: 20px;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 15px 20px;
      max-width: 300px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      z-index: 1000;
      animation: slideInRight 0.3s, fadeOut 0.3s 3.7s forwards;
    }
    @keyframes slideInRight {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    @keyframes fadeOut {
      to { opacity: 0; transform: translateX(100%); }
    }
    .notification-title {
      font-weight: 600;
      margin-bottom: 5px;
      color: #6cf2c2;
    }
    .notification-message {
      font-size: 14px;
      opacity: 0.9;
    }

    /* SETTINGS WINDOW */
    .settings-option {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 15px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .settings-label {
      display: block;
      margin-bottom: 10px;
      font-weight: 500;
    }
    .theme-preview {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    .theme-color {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.2s;
    }
    .theme-color:hover { transform: scale(1.1); }
    .theme-color.active { border-color: white; }
  </style>
</head>
<body>

<!-- SETUP SCREEN -->
<div id="setupScreen" class="setup-screen">
  <div class="setup-card">
    <h1 class="setup-title">yassx Desktop</h1>
    <p class="setup-subtitle">Customize your modern desktop experience</p>
    
    <input type="text" id="userNameInput" class="setup-input" placeholder="Enter your name" value="Guest">
    
    <select id="themeSelect" class="setup-select">
      <option value="default">Default Gradient</option>
      <option value="cosmic">Cosmic Night</option>
      <option value="sunset">Sunset Glow</option>
      <option value="neon">Neon Dreams</option>
      <option value="forest">Forest Mist</option>
      <option value="ocean">Ocean Deep</option>
      <option value="purple">Purple Haze</option>
    </select>
    
    <button id="startButton" class="setup-button">
      <i class="fas fa-rocket"></i> Launch Desktop
    </button>
  </div>
</div>

<!-- TOP BAR -->
<div class="top-bar">
  <div class="logo">
    <i class="fas fa-cube"></i>
    <span class="logo-gradient">yassx</span>
  </div>
  
  <div class="user-display">
    <div class="user-avatar" id="userAvatar">G</div>
    <span id="userNameDisplay">Guest</span>
  </div>
  
  <div class="clock" id="clockDisplay">00:00</div>
</div>

<!-- APPS WINDOW -->
<div id="appsWindow" class="window" style="top: 80px; left: 100px;">
  <div class="window-header">
    <div class="window-controls">
      <div class="control-dot dot-close" onclick="closeWindow('appsWindow')"></div>
      <div class="control-dot dot-minimize" onclick="minimizeWindow('appsWindow')"></div>
      <div class="control-dot dot-maximize" onclick="maximizeWindow('appsWindow')"></div>
    </div>
    <div class="window-title">Applications</div>
  </div>
  <div class="window-content">
    <div class="apps-grid">
      <div class="app-item" onclick="openBrowser('https://www.google.com')">
        <div class="app-icon"><i class="fab fa-google"></i></div>
        <div class="app-name">Google</div>
      </div>
      <div class="app-item" onclick="openBrowser('https://chat.openai.com')">
        <div class="app-icon"><i class="fas fa-robot"></i></div>
        <div class="app-name">AI Chat</div>
      </div>
      <div class="app-item" onclick="openBrowser('https://github.com')">
        <div class="app-icon"><i class="fab fa-github"></i></div>
        <div class="app-name">GitHub</div>
      </div>
      <div class="app-item" onclick="openBrowser('https://www.youtube.com')">
        <div class="app-icon"><i class="fab fa-youtube"></i></div>
        <div class="app-name">YouTube</div>
      </div>
      <div class="app-item" onclick="openBrowser('https://www.notion.so')">
        <div class="app-icon"><i class="fas fa-sticky-note"></i></div>
        <div class="app-name">Notion</div>
      </div>
      <div class="app-item" onclick="openBrowser('https://www.twitch.tv')">
        <div class="app-icon"><i class="fab fa-twitch"></i></div>
        <div class="app-name">Twitch</div>
      </div>
      <div class="app-item" onclick="openBrowser('https://www.reddit.com')">
        <div class="app-icon"><i class="fab fa-reddit"></i></div>
        <div class="app-name">Reddit</div>
      </div>
      <div class="app-item" onclick="openBrowser('https://www.twitter.com')">
        <div class="app-icon"><i class="fab fa-twitter"></i></div>
        <div class="app-name">Twitter</div>
      </div>
    </div>
  </div>
</div>

<!-- BROWSER WINDOW -->
<div id="browserWindow" class="window" style="top: 120px; left: 150px; width: 800px; height: 550px;">
  <div class="window-header">
    <div class="window-controls">
      <div class="control-dot dot-close" onclick="closeWindow('browserWindow')"></div>
      <div class="control-dot dot-minimize" onclick="minimizeWindow('browserWindow')"></div>
      <div class="control-dot dot-maximize" onclick="maximizeWindow('browserWindow')"></div>
    </div>
    <div class="window-title">Browser</div>
  </div>
  <div class="window-content">
    <div class="browser-bar">
      <button class="browser-nav-btn" onclick="browserGoBack()">
        <i class="fas fa-arrow-left"></i> Back
      </button>
      <button class="browser-nav-btn" onclick="browserGoForward()">
        <i class="fas fa-arrow-right"></i> Forward
      </button>
      <button class="browser-nav-btn" onclick="browserRefresh()">
        <i class="fas fa-redo"></i> Refresh
      </button>
      <input type="text" id="urlInput" class="url-bar" placeholder="Enter URL (e.g., https://example.com)" value="https://www.google.com">
      <button class="browser-nav-btn" onclick="browserGo()">
        <i class="fas fa-arrow-right"></i> Go
      </button>
    </div>
    <iframe id="browserFrame" class="browser-frame" src="https://www.google.com"></iframe>
  </div>
</div>

<!-- SETTINGS WINDOW -->
<div id="settingsWindow" class="window" style="top: 100px; left: 200px; width: 600px; height: 450px;">
  <div class="window-header">
    <div class="window-controls">
      <div class="control-dot dot-close" onclick="closeWindow('settingsWindow')"></div>
      <div class="control-dot dot-minimize" onclick="minimizeWindow('settingsWindow')"></div>
      <div class="control-dot dot-maximize" onclick="maximizeWindow('settingsWindow')"></div>
    </div>
    <div class="window-title">Settings</div>
  </div>
  <div class="window-content">
    <div class="settings-option">
      <label class="settings-label">Change Theme</label>
      <div class="theme-preview">
        <div class="theme-color" style="background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);" onclick="changeTheme('default')"></div>
        <div class="theme-color" style="background: linear-gradient(135deg, #41295a, #2F0743);" onclick="changeTheme('cosmic')"></div>
        <div class="theme-color" style="background: linear-gradient(135deg, #ff512f, #dd2476);" onclick="changeTheme('sunset')"></div>
        <div class="theme-color" style="background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);" onclick="changeTheme('neon')"></div>
        <div class="theme-color" style="background: linear-gradient(135deg, #134e5e, #71b280);" onclick="changeTheme('forest')"></div>
      </div>
    </div>
    
    <div class="settings-option">
      <label class="settings-label">Change Name</label>
      <input type="text" id="changeNameInput" class="setup-input" placeholder="New name" style="margin-bottom: 10px;">
      <button class="setup-button" onclick="changeUserName()" style="margin: 0;">Change Name</button>
    </div>
    
    <div class="settings-option">
      <label class="settings-label">Reset Desktop</label>
      <button class="setup-button" onclick="resetDesktop()" style="background: linear-gradient(135deg, #ff5f57, #ffbd2e); margin: 0;">
        <i class="fas fa-redo"></i> Reset
      </button>
    </div>
  </div>
</div>

<!-- DOCK -->
<div class="dock">
  <div class="dock-icon" onclick="openWindow('appsWindow')">
    <i class="fas fa-th-large"></i>
    <div class="dock-tooltip">Applications</div>
  </div>
  <div class="dock-icon" onclick="openBrowser('https://www.google.com')">
    <i class="fas fa-globe"></i>
    <div class="dock-tooltip">Browser</div>
  </div>
  <div class="dock-icon" onclick="openWindow('settingsWindow')">
    <i class="fas fa-cog"></i>
    <div class="dock-tooltip">Settings</div>
  </div>
  <div class="dock-icon" onclick="showNotification('Help', 'Click icons to open apps. Drag windows to move them.')">
    <i class="fas fa-question-circle"></i>
    <div class="dock-tooltip">Help</div>
  </div>
  <div class="dock-icon" onclick="showNotification('About yassx', 'Modern desktop environment v2.0')">
    <i class="fas fa-info-circle"></i>
    <div class="dock-tooltip">About</div>
  </div>
</div>

<script>
// ========== GLOBAL VARIABLES ==========
let currentZIndex = 10;
let draggedWindow = null;
let dragOffsetX = 0;
let dragOffsetY = 0;
let minimizedWindows = {};
let themes = {
  default: 'linear-gradient(135deg, #0f2027, #203a43, #2c5364)',
  cosmic: 'linear-gradient(135deg, #41295a, #2F0743)',
  sunset: 'linear-gradient(135deg, #ff512f, #dd2476)',
  neon: 'linear-gradient(135deg, #0f0c29, #302b63, #24243e)',
  forest: 'linear-gradient(135deg, #134e5e, #71b280)',
  ocean: 'linear-gradient(135deg, #2193b0, #6dd5ed)',
  purple: 'linear-gradient(135deg, #667eea, #764ba2, #f093fb)'
};

// ========== INITIALIZATION ==========
document.addEventListener('DOMContentLoaded', function() {
  // Check if user already configured
  const savedName = localStorage.getItem('yassx_name');
  const savedTheme = localStorage.getItem('yassx_theme');
  
  if (savedName && savedTheme) {
    // Skip setup if already configured
    document.getElementById('setupScreen').classList.add('hidden');
    document.body.style.background = themes[savedTheme] || themes.default;
    document.getElementById('userNameDisplay').textContent = savedName;
    document.getElementById('userAvatar').textContent = savedName.charAt(0).toUpperCase();
    document.getElementById('userNameInput').value = savedName;
    document.getElementById('themeSelect').value = savedTheme;
    
    // Show welcome notification
    setTimeout(() => {
      showNotification(`Welcome back, ${savedName}!`, 'Your desktop is ready.');
    }, 500);
  } else {
    // Show setup screen
    document.getElementById('setupScreen').classList.remove('hidden');
  }
  
  // Start clock
  updateClock();
  setInterval(updateClock, 1000);
  
  // Setup event listeners
  document.getElementById('startButton').addEventListener('click', startDesktop);
  document.getElementById('userNameInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') startDesktop();
  });
  
  // Browser URL input
  document.getElementById('urlInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') browserGo();
  });
  
  // Setup drag and drop for windows
  setupWindowDragging();
  
  // Close setup on Escape key
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && !document.getElementById('setupScreen').classList.contains('hidden')) {
      startDesktop();
    }
  });
});

// ========== DESKTOP FUNCTIONS ==========
function startDesktop() {
  const userName = document.getElementById('userNameInput').value.trim() || 'Guest';
  const theme = document.getElementById('themeSelect').value;
  
  // Save to localStorage
  localStorage.setItem('yassx_name', userName);
  localStorage.setItem('yassx_theme', theme);
  
  // Apply theme
  document.body.style.background = themes[theme] || themes.default;
  
  // Update UI
  document.getElementById('userNameDisplay').textContent = userName;
  document.getElementById('userAvatar').textContent = userName.charAt(0).toUpperCase();
  
  // Hide setup screen with animation
  const setupScreen = document.getElementById('setupScreen');
  setupScreen.style.transition = 'opacity 0.5s ease';
  setupScreen.classList.add('hidden');
  
  // Show welcome notification
  setTimeout(() => {
    showNotification(`Welcome to yassx, ${userName}!`, 'Click on dock icons to launch applications.');
  }, 300);
}

function updateClock() {
  const now = new Date();
  const timeString = now.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
  const dateString = now.toLocaleDateString([], {weekday: 'short', month: 'short', day: 'numeric'});
  document.getElementById('clockDisplay').textContent = `${timeString} • ${dateString}`;
}

// ========== WINDOW MANAGEMENT ==========
function openWindow(windowId) {
  const window = document.getElementById(windowId);
  if (!window) return;
  
  // If window is minimized, restore it
  if (minimizedWindows[windowId]) {
    minimizedWindows[windowId] = false;
    window.style.display = 'block';
  }
  
  // Add active class and focus
  window.classList.add('active');
  focusWindow(window);
  
  // Animation
  gsap.fromTo(window, 
    {scale: 0.9, opacity: 0, y: 20},
    {scale: 1, opacity: 1, y: 0, duration: 0.3, ease: 'back.out(1.2)'}
  );
}

function closeWindow(windowId) {
  const window = document.getElementById(windowId);
  window.classList.remove('active');
  
  gsap.to(window, {
    scale: 0.9, opacity: 0, y: 20, duration: 0.2,
    onComplete: () => {
      window.style.display = 'none';
    }
  });
}

function minimizeWindow(windowId) {
  const window = document.getElementById(windowId);
  minimizedWindows[windowId] = true;
  
  gsap.to(window, {
    scale: 0.8, opacity: 0, y: 100, duration: 0.3,
    onComplete: () => {
      window.style.display = 'none';
    }
  });
}

function maximizeWindow(windowId) {
  const window = document.getElementById(windowId);
  
  if (window.classList.contains('maximized')) {
    // Restore
    window.classList.remove('maximized');
    window.style.width = '';
    window.style.height = '';
    window.style.top = '';
    window.style.left = '';
    window.style.transform = '';
  } else {
    // Maximize
    window.classList.add('maximized');
    window.style.width = 'calc(100vw - 40px)';
    window.style.height = 'calc(100vh - 100px)';
    window.style.top = '20px';
    window.style.left = '20px';
    window.style.transform = 'none';
  }
  
  focusWindow(window);
}

function focusWindow(window) {
  // Remove focused class from all windows
  document.querySelectorAll('.window').forEach(w => {
    w.classList.remove('focused');
  });
  
  // Add focused class to this window
  window.classList.add('focused');
  window.style.zIndex = ++currentZIndex;
}

function setupWindowDragging() {
  // Mouse down on window header
  document.addEventListener('mousedown', function(e) {
    const header = e.target.closest('.window-header');
    if (header) {
      const window = header.parentElement;
      draggedWindow = window;
      focusWindow(window);
      
      // Calculate offset
      const rect = window.getBoundingClientRect();
      dragOffsetX = e.clientX - rect.left;
      dragOffsetY = e.clientY - rect.top;
      
      // Disable transitions during drag
      window.style.transition = 'none';
    }
  });
  
  // Mouse move
  document.addEventListener('mousemove', function(e) {
    if (draggedWindow) {
      // Calculate new position
      let newX = e.clientX - dragOffsetX;
      let newY = e.clientY - dragOffsetY;
      
      // Boundary checking
      const maxX = window.innerWidth - draggedWindow.offsetWidth;
      const maxY = window.innerHeight - 100;
      
      newX = Math.max(10, Math.min(newX, maxX));
      newY = Math.max(10, Math.min(newY, maxY));
      
      // Apply new position
      draggedWindow.style.left = newX + 'px';
      draggedWindow.style.top = newY + 'px';
    }
  });
  
  // Mouse up
  document.addEventListener('mouseup', function() {
    if (draggedWindow) {
      // Re-enable transitions
      draggedWindow.style.transition = '';
      draggedWindow = null;
    }
  });
}

// ========== BROWSER FUNCTIONS ==========
function openBrowser(url) {
  // Update URL input
  document.getElementById('urlInput').value = url;
  
  // Load in iframe
  document.getElementById('browserFrame').src = url;
  
  // Open browser window
  openWindow('browserWindow');
}

function browserGo() {
  const urlInput = document.getElementById('urlInput');
  let url = urlInput.value.trim();
  
  // Add https:// if not present
  if (!url.startsWith('http://') && !url.startsWith('https://')) {
    url = 'https://' + url;
  }
  
  // Load URL
  document.getElementById('browserFrame').src = url;
}

function browserGoBack() {
  const frame = document.getElementById('browserFrame');
  try {
    frame.contentWindow.history.back();
  } catch(e) {
    console.log("Cannot go back");
  }
}

function browserGoForward() {
  const frame = document.getElementById('browserFrame');
  try {
    frame.contentWindow.history.forward();
  } catch(e) {
    console.log("Cannot go forward");
  }
}

function browserRefresh() {
  const frame = document.getElementById('browserFrame');
  frame.src = frame.src;
}

// ========== SETTINGS FUNCTIONS ==========
function changeTheme(themeName) {
  document.body.style.background = themes[themeName] || themes.default;
  localStorage.setItem('yassx_theme', themeName);
  document.getElementById('themeSelect').value = themeName;
  
  // Update active theme preview
  document.querySelectorAll('.theme-color').forEach(color => {
    color.classList.remove('active');
  });
  
  // Show notification
  showNotification('Theme Changed', `Applied ${themeName} theme`);
}

function changeUserName() {
  const newName = document.getElementById('changeNameInput').value.trim();
  if (newName) {
    localStorage.setItem('yassx_name', newName);
    document.getElementById('userNameDisplay').textContent = newName;
    document.getElementById('userAvatar').textContent = newName.charAt(0).toUpperCase();
    document.getElementById('changeNameInput').value = '';
    
    showNotification('Name Updated', `Welcome, ${newName}!`);
  }
}

function resetDesktop() {
  if (confirm('Are you sure you want to reset? This will clear your settings and reload the setup.')) {
    localStorage.removeItem('yassx_name');
    localStorage.removeItem('yassx_theme');
    
    // Close all windows
    document.querySelectorAll('.window').forEach(window => {
      window.classList.remove('active');
      window.style.display = 'none';
    });
    
    // Show setup screen
    document.getElementById('setupScreen').classList.remove('hidden');
    
    showNotification('Desktop Reset', 'Please configure your settings again.');
  }
}

// ========== NOTIFICATION SYSTEM ==========
function showNotification(title, message) {
  // Create notification element
  const notification = document.createElement('div');
  notification.className = 'notification';
  notification.innerHTML = `
    <div class="notification-title">${title}</div>
    <div class="notification-message">${message}</div>
  `;
  
  // Add to body
  document.body.appendChild(notification);
  
  // Remove after animation completes
  setTimeout(() => {
    if (notification.parentNode) {
      notification.parentNode.removeChild(notification);
    }
  }, 4000);
}

// ========== KEYBOARD SHORTCUTS ==========
document.addEventListener('keydown', function(e) {
  // Ctrl + Q to show setup (for testing)
  if (e.ctrlKey && e.key === 'q') {
    e.preventDefault();
    document.getElementById('setupScreen').classList.remove('hidden');
  }
  
  // Escape to close focused window
  if (e.key === 'Escape') {
    const focusedWindow = document.querySelector('.window.focused');
    if (focusedWindow) {
      closeWindow(focusedWindow.id);
    }
  }
  
  // Ctrl + 1-3 for quick apps
  if (e.ctrlKey) {
    if (e.key === '1') openWindow('appsWindow');
    if (e.key === '2') openBrowser('https://www.google.com');
    if (e.key === '3') openWindow('settingsWindow');
  }
});
</script>
